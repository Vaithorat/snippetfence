name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify tag matches package version
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"

          if ($tagVersion -ne $packageVersion) {
            Write-Error "Tag version $tagVersion does not match package.json version $packageVersion"
            exit 1
          }
        shell: pwsh
      - name: Check if version is already published
        id: check_version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view snippetfence@"$PACKAGE_VERSION" version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "snippetfence@$PACKAGE_VERSION is already on npm — skipping publish (likely a re-run of this workflow)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.check_version.outputs.already_published == 'false'
        run: npm publish --provenance --access public
      - name: Create GitHub Release
        if: steps.check_version.outputs.already_published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
